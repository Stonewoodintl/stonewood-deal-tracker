<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stonewood Restaurant Division — Find Your Space</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    header {
      width: 100%;
      max-width: 680px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid #2a2a2a;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.02em;
    }

    header p {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }

    #chat-window {
      flex: 1;
      width: 100%;
      max-width: 680px;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.bot {
      background: #1e2030;
      color: #e8e8e8;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }

    .bubble.user {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 11px 15px;
      background: #1e2030;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }

    .typing span {
      width: 7px; height: 7px;
      background: #888;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }

    #input-row {
      width: 100%;
      max-width: 680px;
      padding: 12px 16px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #2a2a2a;
    }

    #user-input {
      flex: 1;
      background: #1e2030;
      border: 1px solid #333;
      border-radius: 24px;
      padding: 11px 18px;
      color: #e8e8e8;
      font-size: 14px;
      outline: none;
      resize: none;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }

    #user-input::placeholder { color: #555; }
    #user-input:focus { border-color: #2563eb; }

    #send-btn {
      background: #2563eb;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      min-width: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      align-self: flex-end;
    }

    #send-btn:hover { background: #1d4ed8; }
    #send-btn:disabled { background: #333; cursor: default; }

    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    #status-bar {
      width: 100%;
      max-width: 680px;
      text-align: center;
      font-size: 11px;
      color: #444;
      padding: 6px 0 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Stonewood Restaurant Division</h1>
  <p>2nd Gen Restaurant Spaces · DFW · Landlord pays our fee</p>
</header>

<div id="chat-window"></div>

<div id="input-row">
  <textarea id="user-input" placeholder="Type a message…" rows="1"></textarea>
  <button id="send-btn" aria-label="Send">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<div id="status-bar">Powered by Stonewood</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  // Replace with your actual Render URL (no trailing slash)
  const BACKEND_URL = 'https://YOUR-RENDER-APP.onrender.com';

  // ── Session ID ──────────────────────────────────────────────────────────────
  // Persists across page refreshes so the conversation continues
  function getSessionId() {
    let id = localStorage.getItem('sw_session_id');
    if (!id) {
      id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('sw_session_id', id);
    }
    return id;
  }

  const SESSION_ID = getSessionId();

  // ── DOM refs ────────────────────────────────────────────────────────────────
  const chatWindow = document.getElementById('chat-window');
  const input      = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function addBubble(text, role) {
    const el = document.createElement('div');
    el.className = 'bubble ' + role;
    el.textContent = text;
    chatWindow.appendChild(el);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return el;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.id = 'typing-indicator';
    el.innerHTML = '<span></span><span></span><span></span>';
    chatWindow.appendChild(el);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setDisabled(state) {
    input.disabled   = state;
    sendBtn.disabled = state;
  }

  // ── Send message ─────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addBubble(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    setDisabled(true);
    showTyping();

    try {
      const res = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: SESSION_ID, message: text }),
      });

      const data = await res.json();
      hideTyping();
      addBubble(data.reply || data.error || 'No response.', 'bot');
    } catch (err) {
      hideTyping();
      addBubble('Connection error — please try again.', 'bot');
      console.error(err);
    } finally {
      setDisabled(false);
      input.focus();
    }
  }

  // ── Opening greeting ─────────────────────────────────────────────────────────
  async function startChat() {
    setDisabled(true);
    showTyping();
    try {
      const res = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: SESSION_ID, message: 'Get started' }),
      });
      const data = await res.json();
      hideTyping();
      addBubble(data.reply || 'Hello! How can I help you?', 'bot');
    } catch {
      hideTyping();
      addBubble('Unable to connect. Please refresh the page.', 'bot');
    } finally {
      setDisabled(false);
      input.focus();
    }
  }

  // ── Event listeners ──────────────────────────────────────────────────────────
  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ── Start ────────────────────────────────────────────────────────────────────
  startChat();
</script>
</body>
</html>
